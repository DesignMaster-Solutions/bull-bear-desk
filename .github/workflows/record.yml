name: record
on:
  schedule: [{ cron: "10 0 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node record.mjs
      - run: |
          git config user.name "bull-bear-desk"
          git config user.email "info@designmastersolutions.com"
          git add ledger.json
          git diff --cached --quiet || git commit -m "ledger: $(date -u +%F)"
          git push
